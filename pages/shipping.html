<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f58f86" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/imgs/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/imgs/icons/favicon-32x32.png" />
  <title>Shipping Info | KarryKraze</title>

  <meta name="description" content="Shipping rates, delivery timelines, and tracking for Karry Kraze website orders." />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kkpink: '#f58f86',
            kkpeach: '#f6dcc6',
          },
          borderWidth: {
            '4': '4px',
          },
        }
      }
    }
  </script>

  <!-- KK base + components -->
  <link rel="stylesheet" href="/css/theme/base.css">
  <link rel="stylesheet" href="/css/theme/components.css">

  <!-- Meta Pixel -->
  <script src="/js/shared/metaPixel.js"></script>
</head>
<body class="kk-page bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- ✅ NAVBAR INSERT MOUNT (DO NOT REMOVE) -->
  <div id="kkNavbarMount"></div>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 sm:py-12 w-full" id="shippingMain">

    <!-- ① Hero -->
    <header class="text-center mb-8">
      <div class="inline-block bg-black text-white px-3 py-1 text-[10px] font-black uppercase tracking-[.25em] mb-3">
        Shipping
      </div>
      <h1 class="text-3xl sm:text-4xl font-black tracking-tight">How Shipping Works</h1>
      <p class="text-gray-500 text-sm mt-2 max-w-md mx-auto">
        Rates, timelines, and tracking for karrykraze.com orders.
      </p>
    </header>

    <div class="border-t-4 border-black mb-8" aria-hidden="true"></div>

    <!-- ② At-a-Glance Stats (populated by js/pages/shipping/render/stats.js) -->
    <section id="shippingStats" class="mb-8" aria-label="At-a-glance shipping stats"></section>

    <!-- ③ Shipping Rates (populated by js/pages/shipping/render/rates.js) -->
    <section id="shippingRates" aria-label="Shipping rates"></section>

    <!-- ④ Fulfillment Timeline (populated by js/pages/shipping/render/timeline.js) -->
    <section id="shippingTimeline" aria-label="Fulfillment timeline"></section>

    <!-- ⑤ Need to Know (populated by js/pages/shipping/render/needToKnow.js) -->
    <section id="shippingNeedToKnow" aria-label="Shipping policies"></section>

    <!-- ⑥ Peak Season (populated by js/pages/shipping/render/callouts.js) -->
    <section id="shippingPeakSeason" aria-label="Peak season notice"></section>

    <!-- ⑦ Questions CTA (populated by js/pages/shipping/render/callouts.js) -->
    <section id="shippingCta" aria-label="Shipping help links"></section>

  </main>

  <!-- ✅ FOOTER INSERT MOUNT -->
  <div id="kkFooterMount"></div>

  <script type="module" src="/js/pages/shipping/index.js"></script>
  <script type="module" src="/js/shared/pwa.js"></script>
</body>
</html>
